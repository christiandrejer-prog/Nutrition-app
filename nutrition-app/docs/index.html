<!DOCTYPE html>
<html>
<head>
    <title>Nutrition Tracker App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Nutrition Tracker</h1>

    <!-- Nutrients Section -->
    <section id="nutrients-section">
        <h2>Nutrients</h2>
        <input type="text" id="nutrientName" placeholder="Nutrient name (e.g., Protein)">
        <input type="text" id="nutrientUnit" placeholder="Unit (e.g., g)">
        <button type="button" onclick="createNutrient()">Create Nutrient</button>
        <button type="button" id="nutrient-edit-btn" onclick="toggleNutrientEdit()">Edit Nutrients</button>
        <ul id="nutrientList"></ul>
    </section>

    <!-- Foods Section -->
    <section id="foods-section">
        <h2>Foods</h2>
        <input type="text" id="foodName" placeholder="Food name">
        <input type="text" id="foodBrand" placeholder="Brand (optional)">
        <button type="button" onclick="createFood()">Create Food</button>
        <button type="button" onclick="scanBarcode()">Scan Barcode</button>
        <button type="button" id="food-edit-btn" onclick="toggleFoodEdit()">Edit Foods</button>
        <div id="barcode-scanner" style="display: none;">
            <div id="interactive" class="viewport"></div>
            <button onclick="stopScanning()">Stop Scanning</button>
        </div>

        <h3>Food List</h3>
        <ul id="foodList"></ul>
    </section>

    <!-- Food Details Section -->
    <section id="food-details-section">
        <h2>Food Details</h2>
        <select id="foodSelect"></select>
        <button onclick="loadFoodDetails()">Load Details</button>
        <button type="button" id="food-details-edit-btn" onclick="toggleFoodDetailsEdit()">Edit Nutrients in Food</button>
        <div id="foodDetails"></div>

        <h3>Add Nutrient to Food</h3>
        <select id="nutrientSelect"></select>
        <input type="number" id="amountPer100g" placeholder="Amount per 100g" step="0.1">
        <button onclick="addNutrientToFood()">Add Nutrient</button>
    </section>

    <!-- Meals Section -->
    <section id="meals-section">
        <h2>Meals</h2>
        <input type="text" id="mealName" placeholder="Meal name">
        <button onclick="createMeal()">Create Meal</button>
        <button type="button" id="meal-edit-btn" onclick="toggleMealEdit()">Edit Meals</button>

        <h3>Meal List</h3>
        <ul id="mealList"></ul>
    </section>

    <!-- Meal Details Section -->
    <section id="meal-details-section">
        <h2>Meal Details</h2>
        <select id="mealSelect"></select>
        <button onclick="loadMealDetails()">Load Details</button>
        <div id="mealDetails"></div>

        <h3>Add Food to Meal</h3>
        <select id="mealFoodSelect"></select>
        <input type="number" id="foodGrams" placeholder="Grams" step="1">
        <button onclick="addFoodToMeal()">Add Food</button>
    </section>

    <script src="app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>

</body>
</html>
